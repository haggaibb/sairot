buildscript {
    // ✅ define kotlin_version OUTSIDE repositories
    ext.kotlin_version = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.2.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        // ✅ Force ByteBuddy to Java 17-compatible version
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'net.bytebuddy') {
                details.useVersion '1.12.22'  // ✅ Java 8+ compatible
            }
        }

        // ✅ Force BouncyCastle if needed too
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.bouncycastle' && details.requested.name == 'bcprov-jdk18on') {
                details.useVersion '1.70'
            }
        }
        
        // ✅ Force Material library version to be compatible with compileSdk 36
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.android.material' && 
                details.requested.name == 'material') {
                details.useVersion '1.12.0'
            }
        }
    }
    
    // Ensure all projects use compileSdk 36 to fix lStar attribute issue
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
    configurations.all { config ->
        config.exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}